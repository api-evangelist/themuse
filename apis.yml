name: The Muse
kind: company
description: The Muse is a careers and company-profiles platform that helps people find jobs at companies
  whose values match their own. Its free, documented public REST API (v2) exposes hundreds of thousands
  of live job openings - searchable by category, experience level, company, and location - alongside rich
  employer company profiles (industry, size, locations, and behind-the-scenes content). An optional api_key
  raises rate limits. This makes The Muse a strong source for "job openings", jobs, careers, and recruiting
  use cases and for building job boards, career sites, and employer-branding integrations.
