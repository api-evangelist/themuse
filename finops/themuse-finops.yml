publisherName: The Muse
serviceCategory: Careers and Recruiting Data
billingModel:
  pricingCategory: Free
  billingFrequency: None
  billingCurrency: USD
  chargeCategories:
  - Usage
meters:
- name: api_requests
  description: Requests made against the hourly rate limit; free but capped per window.
  unit: requests
  aggregation: sum
  dimensions:
  - application
  - endpoint
- name: rate_limit_window
  description: Hourly rate-limit window consumption (500 anonymous / 3,600 registered).
  unit: requests
  aggregation: max
  dimensions:
  - application
principles:
- name: Visibility
  description: Track requests per endpoint and per hour against the X-RateLimit-Limit ceiling for each application key.
- name: Allocation
  description: Use a distinct api_key per application or team so request budget maps to the consuming workload.
- name: Optimization
  description: Cache job and company results, respect the 20-per-page pagination, and register an api_key to lift the ceiling from 500 to 3,600 requests/hour before considering a commercial arrangement.
- name: Accountability
  description: Monitor 403 rate-limit responses and reset windows; escalate to a commercial agreement with The Muse only when free limits are consistently exceeded.
