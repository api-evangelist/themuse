- FOCUS
description: >-
  FinOps view of consuming The Muse public API. There is no metered usage fee
  for the public API - it is free at both the anonymous (500 requests/hour) and
  registered (3,600 requests/hour) access levels. The only "cost" dimension for
  a consumer is request budget against the hourly rate limit and the engineering
  cost of caching and pagination. Any commercial or higher-volume arrangement is
  negotiated directly with The Muse and would introduce a contract-based cost.
notes: >-
  Because the API is free, there is no vendor invoice to reconcile for standard
  use. Manage "spend" as request-rate budget: cache job and company data, page
  efficiently, and register an api_key to raise the ceiling. Verify any
  commercial terms with The Muse (api@themuse.com) during reconciliation.
sources:
- https://www.themuse.com/developers/api/v2
- https://www.themuse.com/developers/api/v2/terms
